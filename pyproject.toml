[build-system]
# >=77 is what understands the PEP 639 SPDX ``license`` string below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocmap"
dynamic = ["version"]
description = "A modern, AI-friendly CVE PoC discovery tool with structured data models"
readme = "README.md"
# PEP 639 SPDX expression. The ``{text = ...}`` table and the paired
# "License :: OSI Approved" classifier are both deprecated and scheduled for
# removal from the packaging toolchain.
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "PocMap Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
# Floors are the lowest version that is both functional AND free of known
# advisories — a security tool that resolves to a vulnerable dependency is
# hard to defend. Each was verified with `pocmap package PyPI <name> --version
# <floor>` (see CHANGELOG 2.5.0); re-check with the same command when bumping.
dependencies = [
    # 2.0.2 raises AttributeError: __pydantic_core_schema__ on the forward
    # reference in ProductDiscoveryResult, breaking `pocmap schemas`; 2.4.0
    # also clears CVE-2024-3772.
    "pydantic>=2.4.0",
    "requests>=2.33.0",   # CVE-2026-25645 and three older
    "urllib3>=2.7.0",     # CVE-2026-44431; 2.0 carried 8 advisories
    "typer>=0.16",        # older releases cannot parse `Annotated[str | None, ...]`
    "click>=8.3.3",       # CVE-2026-7246
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "markdown>=3.8.1",    # CVE-2025-69534 — reachable from a fetched README
    "jinja2>=3.1.6",      # CVE-2024-56201 and two older
    "tomli>=2.0; python_version<'3.11'",
    "typing_extensions>=4.0; python_version<'3.11'",
    "python-dotenv>=1.2.2",  # CVE-2026-28684
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Floors match what CI actually validates against. The previous floors
    # (mypy>=1.5, ruff>=0.1) name versions that report spurious errors on this
    # codebase, so a contributor installing the declared dev environment saw
    # failures CI does not.
    "mypy>=2.0",
    "ruff>=0.15",
    "types-beautifulsoup4",
    "types-requests",
]
server = [
    # 2.x is the 2026-07-28 protocol core (stateless, cacheable list results).
    # ``mcp.server.fastmcp.FastMCP`` became ``mcp.server.mcpserver.MCPServer``;
    # the SDK still speaks the older protocol to older clients, so requiring 2.x
    # here does not cut off clients that have not upgraded.
    "mcp>=2.0,<3",
]
docs = [
    "mkdocs-material>=9.6",
]

[project.scripts]
pocmap = "pocmap.cli:app"
pocmap-mcp = "pocmap.mcp_server:main"

[project.urls]
Homepage = "https://github.com/zebbern/pocmap"
Documentation = "https://zebbern.github.io/pocmap/"
Repository = "https://github.com/zebbern/pocmap"
Issues = "https://github.com/zebbern/pocmap/issues"

[tool.setuptools.dynamic]
version = {attr = "pocmap.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pocmap = ["data/*", "templates/*.html", "bugbounty/playbooks/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# ``S`` (flake8-bandit) is the point of a security tool linting itself: it is
# what would catch a future subprocess(shell=True), yaml.load, pickle or weak
# hash. ``RUF100`` flags suppressions that no longer suppress anything — six
# ``# noqa: S...`` directives had been inert because ``S`` was never enabled,
# which is how the gap was found.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, bind fixtures to obvious dummy tokens, use fixed seeds, and
# spawn `sys.executable` with a literal script to inspect the MCP surface out
# of process. None of those are the untrusted-input cases ``S`` exists for.
"tests/*" = ["S101", "S105", "S106", "S311", "S603", "S607"]
# The legacy script-runner suites bootstrap ``sys.path`` so they stay runnable
# directly (`python tests/test_edge_cases.py`) from a clone with nothing
# installed. Imports must follow that block by construction, so E402 here is the
# design, not drift — the rest of tests/ is linted normally.
"tests/test_e2e.py" = ["E402"]
"tests/test_edge_cases.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# Third-party / conditional imports that ship no type stubs. `markdown` has no
# published stubs; `tomli`/`tomllib` are the optional TOML backends used by
# lab_service (tomllib is stdlib only on 3.11+, below our 3.10 mypy target).
[[tool.mypy.overrides]]
module = ["markdown", "tomli", "tomllib", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-m 'not network'"
markers = [
    "network: tests that make live network calls (deselected by default)",
]
