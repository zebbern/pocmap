site_name: PocMap
site_description: AI-friendly CVE / PoC / exploit discovery toolkit
site_url: https://zebbern.github.io/pocmap/
repo_url: https://github.com/zebbern/pocmap
repo_name: zebbern/pocmap
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CLI reference: cli.md
  - Bug Bounty Toolkit: bug-bounty.md
  - Verifying PoCs: verifying-pocs.md
  - Architecture: architecture.md
  - Contributing: contributing.md
  - Reference:
      - MCP tools: reference/mcp-tools.md
      - Data model schemas: reference/schemas.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zebbern/pocmap
